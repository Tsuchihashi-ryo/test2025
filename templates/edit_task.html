{% extends 'base.html' %}

{% block title %}Edit Task #{{ task.id }} - Task Management Tool{% endblock %}

{% block navigation %}
    {# This page doesn't need the main navigation, or override if specific navigation is needed #}
{% endblock %}

{% block content %}
    <h2>Edit Task #{{ task.id }}</h2>
    <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}">
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{ task.title }}" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" required>{{ task.description }}</textarea>
        </div>
        <div>
            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="todo" {% if task.status == 'todo' %}selected{% endif %}>To Do</option>
                <option value="inprogress" {% if task.status == 'inprogress' %}selected{% endif %}>In Progress</option>
                <option value="done" {% if task.status == 'done' %}selected{% endif %}>Done</option>
            </select>
        </div>
        <button type="submit">Update Task</button>
    </form>
{% endblock %}
